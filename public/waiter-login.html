<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waiter POS Login | Spice &amp; Sky Rooftop Cafe</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/design-system.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: radial-gradient(circle at 50% 25%, #fffbeb 0%, #fdf6ec 50%, #f4f0e6 100%);
    }
    .login-card {
      background: #ffffff;
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-xl);
      padding: 36px 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }
    .login-logo {
      height: 60px;
      max-width: 240px;
      object-fit: contain;
      margin-bottom: 16px;
    }
    .login-title {
      font-family: var(--font-heading);
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .login-sub {
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }
    .error-banner {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 16px;
      text-align: left;
    }
    .demo-hint {
      margin-top: 20px;
      padding: 12px;
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-align: left;
      line-height: 1.5;
      border: 1px solid var(--border-subtle);
    }
  </style>
  <script>
    // Only clear waiter-specific keys when login page is visited (never touch admin keys!)
    try {
      localStorage.removeItem('spice_waiter_user');
      localStorage.removeItem('spice_waiter_token');
      localStorage.removeItem('spice_waiter_session_id');
    } catch (e) {}

    window.addEventListener('pageshow', function(e) {
      if (e.persisted) {
        try {
          localStorage.removeItem('spice_waiter_user');
          localStorage.removeItem('spice_waiter_token');
          localStorage.removeItem('spice_waiter_session_id');
        } catch (err) {}
      }
    });

    function validateWaiterLogin(e) {
      var ALLOWED = ['shan', 'yawar', 'nawaz'];
      var inputEl = document.getElementById('staffEmail');
      var val = (inputEl ? inputEl.value : '').trim().toLowerCase();
      var isAllowed = ALLOWED.includes(val) || ALLOWED.some(function(w) { return val === (w + '@spiceandsky.com'); });

      if (!isAllowed) {
        if (e) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopPropagation) e.stopPropagation();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
        var errBanner = document.getElementById('errorBanner');
        if (errBanner) {
          errBanner.textContent = 'Access denied. Only Shan, Yawar, and Nawaz are authorized to log into the Waiter Terminal.';
          errBanner.style.display = 'block';
        }
        var loginBtn = document.getElementById('loginBtn');
        if (loginBtn) {
          loginBtn.disabled = false;
          loginBtn.textContent = 'Open Waiter Terminal →';
        }
        return false;
      }
      return true;
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="login-card">
    <img src="/images/logo.png" alt="Spice &amp; Sky Cafe" class="login-logo">
    <h1 class="login-title">Waiter POS Terminal</h1>
    <p class="login-sub">Sign in to take orders for Tables 1 to 9</p>

    <div class="error-banner" id="errorBanner"></div>

    <form id="waiterLoginForm" onsubmit="return validateWaiterLogin(event);">
      <div class="form-group" style="text-align: left;">
        <label class="form-label" for="staffEmail">Staff Username</label>
        <input type="text" id="staffEmail" class="form-input" placeholder="Enter username (Shan, Yawar, or Nawaz)" required autocomplete="username">
      </div>

      <div class="form-group" style="text-align: left;">
        <label class="form-label" for="staffPassword">Password</label>
        <input type="password" id="staffPassword" class="form-input" placeholder="Enter password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary" id="loginBtn" style="width: 100%; margin-top: 8px;">
        Open Waiter Terminal &rarr;
      </button>
    </form>
  </div>

  <script src="/js/supabase-client.js?v=20260914-6"></script>
  <script src="/js/waiter-login.js?v=20260914-6"></script>
</body>
</html>
