<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <defs>
    <linearGradient id="spiceGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="50%" stop-color="#c25e1a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="smokeGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(10, 8)">
    <!-- Steam / Spice Smoke Whisps -->
    <path d="M40 38 C 36 26, 46 16, 42 6" stroke="url(#smokeGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M52 35 C 48 20, 60 12, 54 2" stroke="url(#smokeGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M64 38 C 62 28, 70 18, 68 8" stroke="url(#smokeGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Skyline Silhouette Rising from the Cup -->
    <path d="M28 44 L28 34 L36 34 L36 28 L44 28 L44 38 L50 38 L50 24 L56 24 L56 32 L64 32 L64 26 L72 26 L72 44 Z" fill="url(#spiceGrad)" opacity="0.9" />

    <!-- Stylized Coffee Cup -->
    <path d="M20 44 L80 44 C78 68, 68 82, 50 82 C32 82, 22 68, 20 44 Z" fill="url(#spiceGrad)" />

    <!-- Cup Handle -->
    <path d="M76 50 C86 50, 88 64, 73 70" stroke="url(#spiceGrad)" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Saucer / Rooftop Deck Base -->
    <path d="M12 86 C32 89, 68 89, 88 86 C89 87, 85 91, 50 91 C15 91, 11 87, 12 86 Z" fill="#9a3412" />

    <!-- Star Accent -->
    <polygon points="50,14 52,19 57,20 53,24 54,29 50,26 46,29 47,24 43,20 48,19" fill="#d97706"/>
  </g>

  <!-- TEXT GROUP -->
  <g transform="translate(125, 28)">
    <!-- SPICE & SKY in deep roast coffee tone -->
    <text x="0" y="38" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="3.5" fill="#1c1917">
      SPICE <tspan fill="url(#spiceGrad)">&amp;</tspan> SKY
    </text>

    <!-- Subtitle -->
    <text x="3" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="6" fill="#c25e1a">
      ROOFTOP CAFE
    </text>

    <!-- Tagline micro -->
    <text x="3" y="77" font-family="'Caveat', cursive, sans-serif" font-size="15" font-weight="600" letter-spacing="1" fill="#78716c">
      Rooftop Vibes, Bold Flavors &amp; Cozy Brews
    </text>
  </g>
</svg>
